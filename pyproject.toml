[project]
name = "sam3-remote-api"
version = "1.0.0"
description = "Single-GPU FastAPI service for remote SAM3 pre-annotation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiofiles>=24.1,<26",
    "clip",
    "fastapi>=0.116,<1",
    "numpy>=1.26,<2",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "timm>=1.0.17,<2",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "ultralytics>=8.3.237,<9",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]
