[client]
server = "http://192.168.110.101:8000"
# Paths are relative to this TOML file. Files, directories, and globs are accepted.
inputs = ["../dataset2/val/images"]
recursive = true
batch_size = 16
poll_interval = 3.0
wait_timeout = 7200.0
request_timeout = 600.0
output_dir = "../results"
no_wait = false
no_download = false
dry_run = false
# Do not store secrets here. Uncomment to read X-API-Key from an environment variable.
# api_key_env = "SAM3_API_KEY"

[task]
task_type = "segment"
output_format = "yolo"
client_reference = "person-prelabel-batch"
# These defaults apply to every label below.
aggregation = "deduplicate"
merge_iou = 0.7

[task.prediction]
conf = 0.5
iou = 0.7
imgsz = 644
max_det = 300
retina_masks = true

[task.labels]
# class_id is assigned automatically in this order: person=0, chair=1, ...
person = ["person", "sleeping person", "pedestrian"]
chair = ["chair", "office chair", "seat"]
# A label with only one prompt can also use: car = "car"
