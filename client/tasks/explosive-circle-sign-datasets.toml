[client]
server = "http://192.168.110.101:8002"
# Pass datasets/t1/images ... datasets/t6/images as positional inputs.
inputs = ["../../datasets/t1/images"]
recursive = true
batch_size = 8
poll_interval = 5.0
wait_timeout = 86400.0
request_timeout = 600.0
output_dir = "../../results/explosive-circle-sign-datasets"
no_wait = true
no_download = true
dry_run = false

[task]
task_type = "segment"
output_format = "coco"
client_reference = "explosive-circle-sign-datasets-20260818"
aggregation = "deduplicate"
merge_iou = 0.7

[task.prediction]
conf = 0.25
iou = 0.7
imgsz = 644
max_det = 30
retina_masks = true

[task.labels]
explosive_circle_sign = [
  "red circular explosive warning sign",
  "round red sign with the Chinese character 爆",
  "red Chinese explosive symbol inside a circle",
  "circular explosion warning placard",
]
